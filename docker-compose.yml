version: "3.7"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5174:5174"
      - "3003:3003"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - umbrel_main_network
    command: sh -c "npm install && npm run dev"
    tty: true

networks:
  umbrel_main_network:
    external: true
