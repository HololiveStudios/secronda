version: '3.8'

services:
  secronda:
    build:
      context: .
      dockerfile: Dockerfile
    image: secronda-app:latest
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - ./server/database.db:/usr/src/app/database.db:rw
      - ./server/ssl:/usr/src/app/ssl:ro
      - ./dist:/usr/src/app/dist:ro
    environment:
      NODE_ENV: production
      HTTPS_PORT: 3003
      SSL_KEY_PATH: /usr/src/app/ssl/server.key
      SSL_CERT_PATH: /usr/src/app/ssl/server.crt
    healthcheck:
      test: ["CMD", "node", "-e", "const https = require('https'); const options = { hostname: 'localhost', port: 3003, path: '/api/health', method: 'GET', rejectUnauthorized: false }; const req = https.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Logs mais detalhados para debug
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"